<VirtualHost webserver.lan.tfc.pw:80>
    ServerAdmin  infra@thiagocrepaldi.com
    ServerName familiacrepaldi.com
    ServerAlias www.familiacrepaldi.com
    DocumentRoot /var/www/familiacrepaldi.com
    ErrorLog /var/www/familiacrepaldi.com/error.log
    CustomLog /var/www/familiacrepaldi.com/access.log combined
#    ErrorLog ${APACHE_LOG_DIR}/error.log
#    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

