
<VirtualHost web1.lan.tfc.pw:80>
    ServerAdmin  infra@thiagocrepaldi.com
    ServerName geekistheway.com
    ServerAlias www.geekistheway.com
    DocumentRoot /var/www/geekistheway.com
#    ErrorLog ${APACHE_LOG_DIR}/error.log
    ErrorLog /var/www/geekistheway.com/error.log
#    CustomLog ${APACHE_LOG_DIR}/access.log combined
    CustomLog /var/www/geekistheway.com/access.log combined
</VirtualHost>

<VirtualHost web1.lan.tfc.pw:80>
    ServerAdmin  infra@thiagocrepaldi.com
    ServerName forum.geekistheway.com
    ServerAlias forums.geekistheway.com
#    ErrorLog ${APACHE_LOG_DIR}/error.log
    ErrorLog /var/www/geekistheway.com/forum_error.log
#    CustomLog ${APACHE_LOG_DIR}/access.log combined
    CustomLog /var/www/geekistheway.com/forum_access.log combined
    RedirectPermanent / https://geekistheway.com/forums/forum/discussion-is-the-way/
</VirtualHost>
