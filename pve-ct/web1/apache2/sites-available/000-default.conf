<VirtualHost web1.lan.tfc.pw:80>
    ServerAdmin  infra@thiagocrepaldi.com
    ServerName default
    DocumentRoot /var/www/html
</VirtualHost>
<VirtualHost *:80>
    ServerAdmin  infra@thiagocrepaldi.com
    ServerName default
    DocumentRoot /var/www/html
</VirtualHost>
<VirtualHost _default_:80>
    ServerAdmin  infra@thiagocrepaldi.com
    DocumentRoot /var/www/html
</VirtualHost>

